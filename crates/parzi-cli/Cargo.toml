[package]
name = "parzi-cli"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "parzi"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
parzi-core = { path = "../parzi-core" }
parzi-providers = { path = "../parzi-providers" }
parzi-runtime = { path = "../parzi-runtime" }
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros"] }
clap = { version = "4", features = ["derive"] }
serde_json = "1"
anyhow = "1"
async-trait = "0.1"
keyring = "4"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt"] }
