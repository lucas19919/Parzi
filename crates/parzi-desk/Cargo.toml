[package]
name = "parzi-desk"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Parzi native desktop UI (egui/eframe)"
publish = false

[[bin]]
name = "parzi-desk"
path = "src/main.rs"

# Strict workspace lints (Phase 0.1): forbid until the day unsafe is needed.
[lints]
workspace = true

[dependencies]
parzi-core = { path = "../parzi-core" }
parzi-providers = { path = "../parzi-providers" }
parzi-runtime = { path = "../parzi-runtime" }

# `glow` is the plan's fallback renderer (§1); selected with PARZI_DESK_RENDERER=glow.
eframe = { version = "0.36", features = ["persistence", "glow"] }
egui = "0.36"
egui_extras = { version = "0.36", features = ["image"] }
epaint = "0.36"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# Phase 1 (transcript): markdown events + highlighting.
pulldown-cmark = "0.13"
syntect = { version = "5", default-features = false, features = ["default-fancy"] }
# Phase 2 (bridge): UI-thread channel.
crossbeam-channel = "0.5"
# Phase 4 (settings): OS keyring for provider API keys.
keyring = "4"
# Phase 0 (minisign compat test): verify Tauri signatures with our pubkey.
minisign-verify = "0.2"

[build-dependencies]
# Phase 0 (Windows icon): embed src-tauri/icons/icon.ico.
winres = "0.1"
