[package]
name = "parzi-providers"
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
parzi-core = { path = "../parzi-core" }
# `process` + `io-util`: every provider is a vendor program Parzi drives over
# its stdio, and the GitHub module drives `git` and `gh`.
tokio = { version = "1", features = ["rt", "macros", "sync", "time", "net", "process", "io-util", "fs"] }
tokio-util = "0.7"
# GitHub REST only: no provider talks to a model API.
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls-webpki-roots"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
keyring = "4"
dirs = "5"
async-trait = "0.1"
uuid = { version = "1", features = ["v4"] }
base64 = "=0.22.1"

[dev-dependencies]
async-trait = "0.1"
tokio-util = "0.7"
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros", "sync", "time", "io-util"] }
