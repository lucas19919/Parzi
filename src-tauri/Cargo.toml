[package]
name = "parzi-app"
version = "0.1.18"
edition = "2021"

# Detached crate: not a workspace member, so GUI deps never leak into the CLI.
[workspace]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset", "custom-protocol"] }
tauri-plugin-dialog = "2"
tauri-plugin-updater = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
tokio-util = "0.7"
parzi-core = { path = "../crates/parzi-core" }
parzi-providers = { path = "../crates/parzi-providers" }
parzi-runtime = { path = "../crates/parzi-runtime" }
uuid = { version = "1", features = ["v4"] }
# The shell logs the same way the crates it drives do (R-5 queue recovery),
# into a daily file under ~/.parzi/logs. The writer is the CLI's and the
# date crate parzi-core's, so nothing new enters the tree.
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt"] }
chrono = "0.4"
anyhow = "1"
async-trait = "0.1"
base64 = "0.22"

# E12: native Windows 11 rounded corners, so the window can stay opaque
# instead of paying for a per-pixel-alpha composition surface. Same 0.61 the
# Tauri stack already links, so no new crates enter the tree.
[target."cfg(windows)".dependencies]
windows = { version = "0.61", features = ["Win32_Foundation", "Win32_Graphics_Dwm"] }

# S-8: the GUI ships to users — same release profile and lint gates as the
# workspace crates (opt-level z, LTO, strip, unsafe forbid).
[profile.release]
opt-level = "z"
lto = true
strip = true
codegen-units = 1

[lints.rust]
# `deny`, not `forbid`: `forbid` cannot be lifted anywhere inside the crate —
# not even by a scoped `#![allow]` in one module — and the app needs exactly
# one dwmapi FFI call. So: `deny` here, and the only `#![allow(unsafe_code)]`
# sits in src/dwm.rs, which contains nothing but that call. Every other file
# stays unsafe-free, and adding unsafe anywhere else is a build error.
unsafe_code = "deny"

[lints.clippy]
all = "warn"
pedantic = "warn"
