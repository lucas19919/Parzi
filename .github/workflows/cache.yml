name: Release cache

# GitHub scopes caches by ref: a tag build can restore what main saved, but
# never what an earlier tag saved, so every release compiled from scratch.
# This builds the release app on main (same toolchain, args and cache key as
# release.yml) when dependencies change, and weekly so the cache outlives
# GitHub's 7-day eviction. Release jobs restore it and rebuild only Parzi.
on:
  push:
    branches: [main]
    paths:
      - "Cargo.lock"
      - "**/Cargo.toml"
      - "src-tauri/Cargo.lock"
      - "ui/package-lock.json"
      - "rust-toolchain.toml"
      - ".github/actions/setup/action.yml"
      - ".github/workflows/cache.yml"
      - ".github/workflows/release.yml"
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

concurrency:
  group: release-cache
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            args: "--bundles nsis"
          - platform: macos-latest
            args: "--target aarch64-apple-darwin --bundles app,dmg"
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
        with:
          node: "true"
          cache-key: release-app
          cache-workspaces: src-tauri -> target

      # No tagName: tauri-action only builds, nothing is published.
      - uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        with:
          args: ${{ matrix.args }}
