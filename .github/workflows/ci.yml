name: CI
on:
  push: { branches: [main] }
  pull_request:
concurrency:
  group: "ci-${{ github.ref }}"
  cancel-in-progress: true
jobs:
  rust:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest] # both release targets
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with: { toolchain: "1.89.0", components: "clippy, rustfmt" }
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: ". -> target\nsrc-tauri -> target" }
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D clippy::correctness -D clippy::suspicious -D clippy::complexity -D clippy::perf
      - run: cargo test --workspace --no-fail-fast
        env:
          PARZI_HOME: ${{ runner.temp }}/parzi-test-home
      - run: cargo check --manifest-path src-tauri/Cargo.toml
  ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm, cache-dependency-path: ui/package-lock.json }
      - run: npm --prefix ui ci
      - run: npm --prefix ui run check
      - run: npm --prefix ui run build
      # Prod deps only: vite/svelte dev-server and SSR advisories never ship
      # (static dist in a Tauri webview); markdown-it/DOMPurify/hljs do.
      - run: npm --prefix ui audit --omit=dev --audit-level=high
  hygiene:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: | # versions agree
          v=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          grep -q "\"version\": \"$v\"" src-tauri/tauri.conf.json ui/package.json
          grep -q "^version = \"$v\"" src-tauri/Cargo.toml
      - run: test ! -f package.json # no root npm junk
      - run: '! git ls-files | grep -E "^(ui/dist|target|src-tauri/gen)/"'
