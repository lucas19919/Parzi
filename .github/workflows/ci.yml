name: CI

# Every push to any branch, and pull requests from forks (a branch in this
# repo is already covered by its push). Docs-only changes skip it.
on:
  push:
    branches: ["**"]
    paths-ignore: ["**.md", "docs/**", "site/**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Fast checks that fail early: formatting, one version everywhere, the
  # release script, nothing built committed.
  checks:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
        with: { cache-save: "false" }
      - name: Formatting
        run: |
          cargo fmt --all --check
          cargo fmt --manifest-path src-tauri/Cargo.toml --check
          cargo fmt --manifest-path setup/Cargo.toml --check
      - name: One version everywhere
        run: node scripts/release.mjs check
      - name: The release script
        run: node --test scripts/release.test.mjs
      - name: Nothing built is committed
        run: |
          test ! -f package.json
          ! git ls-files | grep -E "^(ui/dist|target|target-dev|src-tauri/gen)/"

  # The engine is what runs on a ParziOS server: it must build and pass on Linux.
  engine:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: cargo clippy --workspace --all-targets
      - run: cargo test --workspace --no-fail-fast
        env:
          PARZI_HOME: ${{ runner.temp }}/parzi-test-home

  # The desktop app and the engine on the machines people install Parzi on.
  app:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
        with:
          node: "true"
          cache-workspaces: ". -> target\nsrc-tauri -> target"
      - run: cargo clippy --workspace --all-targets
      - run: cargo test --workspace --no-fail-fast
        env:
          PARZI_HOME: ${{ runner.temp }}/parzi-test-home
      - run: npm --prefix ui run build
      - run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets
      - name: The Windows setup window
        if: runner.os == 'Windows'
        run: cargo clippy --locked --manifest-path setup/Cargo.toml

  ui:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
        with: { rust: "false", node: "true" }
      - run: npm --prefix ui run check
      - run: npm --prefix ui run lint:tokens
      - run: npm --prefix ui run test
      - run: npm --prefix ui run build
      - run: npm --prefix ui audit --omit=dev --audit-level=high
