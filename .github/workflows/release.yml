name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  release:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            args: "--bundles nsis"
          - platform: macos-latest
            # app is what produces the updater archive; dmg alone leaves macOS
            # out of latest.json.
            args: "--target aarch64-apple-darwin --bundles app,dmg"
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: ui/package-lock.json

      # Same toolchain as ci.yml and cache.yml: it is part of the cache key.
      - uses: dtolnay/rust-toolchain@master
        with: { toolchain: "1.98.0" }

      # Restores what cache.yml saved on main. A cache saved here would be
      # scoped to this tag, which no later release can read: don't save.
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: release-app
          workspaces: src-tauri -> target
          save-if: false

      - run: npm --prefix ui ci

      # Pinned: floating @v0 once pulled a CLI with different hook-cwd
      # behavior and broke a release. Bump deliberately, never floating.
      - uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Parzi ${{ github.ref_name }}"
          # Replace "What changed" on every release. A stale section ships
          # on the next tag, because this file is the published body.
          releaseBody: |
            ## Parzi ${{ github.ref_name }}

            One harness, six providers — Claude, Codex, Antigravity, OpenCode, Grok, Cursor.

            ### What changed

            - Connectors work in sessions. Agents can now call the tools of every connector you turned on in Settings, such as diagonaldiagrams, GitHub, Notion and Linear, with the same approvals as Parzi's own tools. Before, connectors could be tested in Settings but no session could use them.
            - Diagrams come from diagonaldiagrams and show in the thread. Agents no longer draw their own SVG or HTML pages, and charts all use one style.
            - Plans wait for your yes. When an agent starts a plan or adds, drops or rewords work, you see the change and choose Use this plan, Not now, or say what to change. Progress still updates on its own. The plan card shows phases, the goal, and who is on each item.
            - Far fewer failed tool calls. Claude no longer reaches for a shell Parzi refuses, Codex waits long enough for long commands and your approvals, tools accept the arguments agents send, and every refusal says why and what to do next.
            - Helper sessions started from an Ask or Edits session ask you instead of failing quietly.
            - Connectors install behind a company proxy, run calls side by side, and show their full error when you open one that fails. Agents are told which connectors work, so they say so instead of guessing.
            - Corners are the same 12px everywhere, small icon buttons included.
            - Browser fixes: a page no longer hides behind the loading shimmer after a quick second click, Ctrl+B and Ctrl+H work inside pages again, and the shield always shows the current site. The web box and a page's address bar suggest the same way.
            - Agent instructions are rewritten in plain words, with you in the loop on big work and at the end of each plan phase.

            Sessions saved before this still show their old HTML and SVG cards and old charts.

            ### Download

            | Your machine | Pick this file |
            | --- | --- |
            | Windows 10 / 11, 64-bit | `Parzi-Setup.exe` — one click, no admin needed, opens Parzi when it's done |
            | macOS, Apple Silicon | `Parzi_*_aarch64.dmg` — drag Parzi into Applications |
            | Command line, not the app | `parzi-cli-windows-x64.exe` or `parzi-cli-macos-arm64` — drives sessions and tabs from scripts |
            | Your own Linux server (ParziOS) | `parzi-linux-x64` or `parzi-linux-arm64` — the desktop's *Set up remote* installs it for you |

            `Parzi_*_x64-setup.exe` and `Parzi*.app.tar.gz` are the files the in-app updater downloads. You don't need them.

            ### First launch (once per machine)

            - **Windows:** SmartScreen asks once because setup isn't Authenticode-signed yet — *More info → Run anyway*.
            - **macOS:** Gatekeeper blocks the first open because the build isn't Apple-notarized — open Parzi once, then *System Settings → Privacy & Security → Open Anyway*. Afterwards it launches normally.

            ### Updates

            Parzi checks for new versions on launch and offers them in the app — no manual reinstalls.

            > Your threads and settings live in `~/.parzi` and are never touched by updates or reinstalls.
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}

      - name: Re-attach bundles the uploader may have dropped
        if: always() && startsWith(github.ref, 'refs/tags/')
        continue-on-error: true
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          shopt -s nullglob
          # Only the installers and their updater signatures: the dmg folder
          # also holds bundle_dmg.sh and icon.icns, which are build helpers.
          files=(src-tauri/target/release/bundle/nsis/*-setup.exe \
                 src-tauri/target/release/bundle/nsis/*-setup.exe.sig \
                 src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/*.dmg)
          for f in "${files[@]}"; do
            [ -f "$f" ] || continue
            gh release upload "${{ github.ref_name }}" "$f" --clobber
          done

      # Without notarization Gatekeeper still asks once, but an unsealed bundle
      # reads as "damaged" with no way past it. Check the dmg people download.
      - name: Check the Mac app is sealed and updatable
        if: runner.os == 'macOS'
        shell: bash
        run: |
          bundle=src-tauri/target/aarch64-apple-darwin/release/bundle
          mount=$(mktemp -d)
          hdiutil attach -nobrowse -readonly -mountpoint "$mount" "$bundle"/dmg/*.dmg
          codesign --verify --deep --strict --verbose=2 "$mount/Parzi.app"
          hdiutil detach "$mount"
          test -f "$bundle/macos/Parzi.app.tar.gz.sig"

      # The one-click setup people download: a small window around the NSIS
      # installer above, which stays what the in-app updater runs.
      - name: Build and attach Parzi-Setup.exe
        if: runner.os == 'Windows' && startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version="${{ github.ref_name }}"
          export PARZI_INSTALLER="$PWD/src-tauri/target/release/bundle/nsis/Parzi_${version#v}_x64-setup.exe"
          test -f "$PARZI_INSTALLER"
          cargo build --release --locked --manifest-path setup/Cargo.toml
          cp setup/target/release/parzi-setup.exe Parzi-Setup.exe
          gh release upload "${{ github.ref_name }}" Parzi-Setup.exe --clobber

  cli:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            exe: parzi-cli-windows-x64.exe
            build: target/release/parzi.exe
          - platform: macos-latest
            exe: parzi-cli-macos-arm64
            build: target/release/parzi
          # ParziOS: `Set up remote` downloads these and checks the .sha256.
          # Built on 22.04 so the glibc floor is 2.35 (Ubuntu 22.04, Debian 12).
          - platform: ubuntu-22.04
            exe: parzi-linux-x64
            build: target/release/parzi
          - platform: ubuntu-22.04-arm
            exe: parzi-linux-arm64
            build: target/release/parzi
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@master
        with: { toolchain: "1.98.0" }

      # The CLI waits for the app job's release anyway, so it builds cold;
      # saving a tag-scoped cache here would only crowd out main's caches.
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> target
          save-if: false

      - name: Build parzi CLI
        run: cargo build --release -p parzi-cli

      - name: Attach CLI to the release
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # The app job creates the release; wait for it (up to ~30 min).
          for i in $(seq 1 60); do
            gh release view "${{ github.ref_name }}" >/dev/null 2>&1 && break
            sleep 30
          done
          cp "${{ matrix.build }}" "${{ matrix.exe }}"
          files=("${{ matrix.exe }}")
          if [[ "${{ matrix.exe }}" == parzi-linux-* ]]; then
            sha256sum "${{ matrix.exe }}" > "${{ matrix.exe }}.sha256"
            files+=("${{ matrix.exe }}.sha256")
          fi
          gh release upload "${{ github.ref_name }}" "${files[@]}" --clobber
