name: Release

# Two ways in (see docs/releasing.md):
# - Actions, Release, Run workflow. Pick dev (the default), patch, minor or
#   major, or type an exact version. It writes the version to every file,
#   commits, tags and builds, on the branch it was run from.
# - Push a tag vX.Y.Z or vX.Y.Z-dev.N that matches the version in the files.
# A version with a suffix is a pre-release: the stable updater never offers
# it, the dev channel does. The notes come from CHANGELOG.md.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      bump:
        description: What to release
        type: choice
        options: [dev, patch, minor, major]
        default: dev
      version:
        description: Or an exact version, like 1.5.0-dev.1 (wins over the choice above)
        required: false
        default: ""

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write

env:
  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  GH_REPO: ${{ github.repository }}

jobs:
  # Settles the version and opens the release page with its notes; the
  # builds below attach their files to it.
  prepare:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v7

      - name: Bump, commit and tag
        if: github.event_name == 'workflow_dispatch'
        env:
          WANT: ${{ inputs.version || inputs.bump }}
        run: |
          v=$(node scripts/release.mjs cut "$WANT")
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "release $v"
          git tag "v$v"
          git push origin "HEAD:$GITHUB_REF_NAME" "v$v"

      - name: Version
        id: version
        run: |
          node scripts/release.mjs check
          v=$(node scripts/release.mjs version)
          if [ "$GITHUB_EVENT_NAME" = push ] && [ "$GITHUB_REF_NAME" != "v$v" ]; then
            echo "::error::The tag is $GITHUB_REF_NAME but the files say $v. Release with Actions, Release, Run workflow, or run node scripts/release.mjs set first."
            exit 1
          fi
          case "$v" in *-*) pre=true ;; *) pre=false ;; esac
          { echo "version=$v"; echo "tag=v$v"; echo "prerelease=$pre"; } >> "$GITHUB_OUTPUT"

      - name: Open the release page
        env:
          V: ${{ steps.version.outputs.version }}
          TAG: ${{ steps.version.outputs.tag }}
          PRE: ${{ steps.version.outputs.prerelease }}
        run: |
          node scripts/release.mjs notes "$V" > notes.md
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --notes-file notes.md --prerelease="$PRE"
          else
            gh release create "$TAG" --verify-tag --title "Parzi $TAG" --notes-file notes.md --prerelease="$PRE"
          fi

  app:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            args: "--bundles nsis"
          - platform: macos-latest
            # app is what produces the updater archive; dmg alone leaves macOS
            # out of latest.json.
            args: "--target aarch64-apple-darwin --bundles app,dmg"
    runs-on: ${{ matrix.platform }}
    env:
      TAG: ${{ needs.prepare.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with: { ref: "${{ needs.prepare.outputs.tag }}" }

      # Restores what cache.yml saved on main. A cache saved here would be
      # scoped to this tag, which no later release can read: don't save.
      - uses: ./.github/actions/setup
        with:
          node: "true"
          cache-key: release-app
          cache-workspaces: src-tauri -> target
          cache-save: "false"

      # Pinned: floating @v0 once pulled a CLI with different hook-cwd
      # behavior and broke a release. Bump deliberately, never floating.
      - uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        with:
          tagName: ${{ needs.prepare.outputs.tag }}
          releaseName: "Parzi ${{ needs.prepare.outputs.tag }}"
          releaseDraft: false
          prerelease: ${{ needs.prepare.outputs.prerelease == 'true' }}
          args: ${{ matrix.args }}

      - name: Re-attach bundles the uploader may have dropped
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          shopt -s nullglob
          # Only the installers and their updater signatures: the dmg folder
          # also holds bundle_dmg.sh and icon.icns, which are build helpers.
          files=(src-tauri/target/release/bundle/nsis/*-setup.exe \
                 src-tauri/target/release/bundle/nsis/*-setup.exe.sig \
                 src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/*.dmg)
          for f in "${files[@]}"; do
            [ -f "$f" ] || continue
            gh release upload "$TAG" "$f" --clobber
          done

      # Without notarization Gatekeeper still asks once, but an unsealed bundle
      # reads as "damaged" with no way past it. Check the dmg people download.
      - name: Check the Mac app is sealed and updatable
        if: runner.os == 'macOS'
        shell: bash
        run: |
          bundle=src-tauri/target/aarch64-apple-darwin/release/bundle
          mount=$(mktemp -d)
          hdiutil attach -nobrowse -readonly -mountpoint "$mount" "$bundle"/dmg/*.dmg
          codesign --verify --deep --strict --verbose=2 "$mount/Parzi.app"
          hdiutil detach "$mount"
          test -f "$bundle/macos/Parzi.app.tar.gz.sig"

      # The one-click setup people download: a small window around the NSIS
      # installer above, which stays what the in-app updater runs.
      - name: Build and attach Parzi-Setup.exe
        if: runner.os == 'Windows'
        shell: bash
        run: |
          export PARZI_INSTALLER="$PWD/src-tauri/target/release/bundle/nsis/Parzi_${TAG#v}_x64-setup.exe"
          test -f "$PARZI_INSTALLER"
          cargo build --release --locked --manifest-path setup/Cargo.toml
          cp setup/target/release/parzi-setup.exe Parzi-Setup.exe
          gh release upload "$TAG" Parzi-Setup.exe --clobber

  cli:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            exe: parzi-cli-windows-x64.exe
            build: target/release/parzi.exe
          - platform: macos-latest
            exe: parzi-cli-macos-arm64
            build: target/release/parzi
          # ParziOS: `Set up remote` downloads these and checks the .sha256.
          # Built on 22.04 so the glibc floor is 2.35 (Ubuntu 22.04, Debian 12).
          - platform: ubuntu-22.04
            exe: parzi-linux-x64
            build: target/release/parzi
          - platform: ubuntu-22.04-arm
            exe: parzi-linux-arm64
            build: target/release/parzi
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v7
        with: { ref: "${{ needs.prepare.outputs.tag }}" }

      # A tag-scoped cache would only crowd out main's caches: don't save.
      - uses: ./.github/actions/setup
        with: { cache-save: "false" }

      - name: Build parzi CLI
        run: cargo build --release -p parzi-cli

      - name: Attach CLI to the release
        shell: bash
        env:
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          cp "${{ matrix.build }}" "${{ matrix.exe }}"
          files=("${{ matrix.exe }}")
          if [[ "${{ matrix.exe }}" == parzi-linux-* ]]; then
            sha256sum "${{ matrix.exe }}" > "${{ matrix.exe }}.sha256"
            files+=("${{ matrix.exe }}.sha256")
          fi
          gh release upload "$TAG" "${files[@]}" --clobber

  # The dev channel: a rolling pre-release, `updater-dev`, holding the newest
  # build's latest.json, stable or dev. Parzi's "Dev builds" switch checks it.
  # It is a pre-release, so /releases/latest (the stable channel) never sees it.
  channel:
    needs: [prepare, app]
    runs-on: ubuntu-latest
    steps:
      - name: Point the dev channel at this build
        env:
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          gh release download "$TAG" --pattern latest.json --dir out
          if ! gh release view updater-dev >/dev/null 2>&1; then
            gh release create updater-dev --prerelease --title "Dev channel" \
              --notes "Where Parzi's Dev builds setting looks for updates. Not an install: see the releases above." \
              --target "${{ github.sha }}"
          fi
          gh release upload updater-dev out/latest.json --clobber

  # Old dev builds and stale drafts off the releases page (prune.yml).
  prune:
    needs: [prepare, channel]
    uses: ./.github/workflows/prune.yml
    with:
      keep: ${{ needs.prepare.outputs.tag }}
