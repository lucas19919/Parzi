name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  release:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            args: "--bundles nsis"
          - platform: macos-latest
            args: "--target aarch64-apple-darwin --bundles dmg"
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - run: npm --prefix ui ci

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Parzi ${{ github.ref_name }}"
          releaseBody: |
            ## Parzi ${{ github.ref_name }}

            One harness, six providers — Claude, Codex, Antigravity, OpenCode, Grok, Cursor.

            ### Download

            | Your machine | Pick this file |
            | --- | --- |
            | Windows 10 / 11, 64-bit (recommended) | `Parzi_*_x64-setup.exe` — per-user install, no admin needed |
            | macOS, Apple Silicon | `Parzi_*_aarch64.dmg` — drag Parzi into Applications |
            | Command line | `parzi-windows-x64.exe` or `parzi-macos-arm64` — drives sessions and tabs from scripts |

            ### First launch (once per machine)

            - **Windows:** SmartScreen asks once because the installer isn't Authenticode-signed yet — *More info → Run anyway*.
            - **macOS:** Gatekeeper asks once because the build isn't Apple-notarized — right-click (or Ctrl-click) Parzi in Applications → *Open* → *Open*. Afterwards it launches normally.

            ### Updates

            Parzi checks for new versions on launch and offers them in the app — no manual reinstalls.

            > Your threads and settings live in `~/.parzi` and are never touched by updates or reinstalls.
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}

      - name: Re-attach bundles the uploader may have dropped
        if: always() && startsWith(github.ref, 'refs/tags/')
        continue-on-error: true
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          shopt -s nullglob
          files=(src-tauri/target/release/bundle/nsis/* \
                 src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/*)
          for f in "${files[@]}"; do
            [ -f "$f" ] || continue
            gh release upload "${{ github.ref_name }}" "$f" --clobber
          done

  cli:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            exe: parzi-windows-x64.exe
            build: target/release/parzi.exe
          - platform: macos-latest
            exe: parzi-macos-arm64
            build: target/release/parzi
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> target

      - name: Build parzi CLI
        run: cargo build --release -p parzi-cli

      - name: Attach CLI to the release
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # The app job creates the release; wait for it (up to ~30 min).
          for i in $(seq 1 60); do
            gh release view "${{ github.ref_name }}" >/dev/null 2>&1 && break
            sleep 30
          done
          cp "${{ matrix.build }}" "${{ matrix.exe }}"
          gh release upload "${{ github.ref_name }}" "${{ matrix.exe }}" --clobber
