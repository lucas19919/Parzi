name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  release:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            args: ""
          - platform: macos-latest
            args: "--target universal-apple-darwin"
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - name: Add macOS Rust targets
        if: runner.os == 'macOS'
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - run: npm --prefix ui ci

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Parzi ${{ github.ref_name }}"
          releaseBody: |
            ## Parzi ${{ github.ref_name }}

            One harness, six providers — Claude, Codex, Antigravity, OpenCode, Grok, Cursor.

            ### Download

            | Your machine | Pick this file |
            | --- | --- |
            | Windows 10 / 11, 64-bit (recommended) | `Parzi_*_x64-setup.exe` — per-user install, no admin needed |
            | Windows, system-wide | `Parzi_*_x64_en-US.msi` — needs admin |
            | macOS, Apple Silicon or Intel | `Parzi_*_universal.dmg` — drag Parzi into Applications |
            | Command line | `parzi-windows-x64.exe` or `parzi-macos-arm64` — drives sessions and tabs from scripts |

            ### First launch (once per machine)

            - **Windows:** SmartScreen asks once because the installer isn't Authenticode-signed yet — *More info → Run anyway*.
            - **macOS:** Gatekeeper asks once because the build isn't Apple-notarized — right-click (or Ctrl-click) Parzi in Applications → *Open* → *Open*. Afterwards it launches normally.

            ### Updates

            Parzi checks for new versions on launch and offers them in the app — no manual reinstalls.

            > Your threads and settings live in `~/.parzi` and are never touched by updates or reinstalls.
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}

      - name: Re-attach bundles the uploader may have dropped
        if: always() && startsWith(github.ref, 'refs/tags/')
        continue-on-error: true
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          shopt -s nullglob
          files=(src-tauri/target/release/bundle/{nsis,msi}/* \
                 src-tauri/target/universal-apple-darwin/release/bundle/{dmg,macos}/*)
          for f in "${files[@]}"; do
            [ -f "$f" ] || continue
            gh release upload "${{ github.ref_name }}" "$f" --clobber
          done

      - name: Build parzi CLI
        run: cargo build --release -p parzi-cli

      - name: Attach CLI to the release
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "${{ runner.os }}" = "Windows" ]; then
            cp target/release/parzi.exe parzi-windows-x64.exe
            gh release upload "${{ github.ref_name }}" parzi-windows-x64.exe --clobber
          else
            cp target/release/parzi parzi-macos-arm64
            gh release upload "${{ github.ref_name }}" parzi-macos-arm64 --clobber
          fi
