[workspace]
members = [
    "crates/parzi-core",
    "crates/parzi-providers",
    "crates/parzi-runtime",
    "crates/parzi-cli",
    "crates/parzi-desk",
]
# src-tauri is a detached crate (own lockfile surface); GUI deps never leak into the CLI.
exclude = ["src-tauri"]
resolver = "2"

[workspace.package]
version = "0.1.11"
edition = "2021"
license = "MIT"
repository = "https://github.com/lucas19919/Parzi"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"
pedantic = "warn"

[profile.release]
opt-level = "z"
lto = true
strip = true
codegen-units = 1

# The GUI is latency bound, not size bound: `opt-level = "z"` slows egui layout
# and text shaping. Keep the CLI tiny, the desk fast.
[profile.release.package.parzi-desk]
opt-level = 2
