[workspace]
members = [
    "crates/parzi-core",
    "crates/parzi-providers",
    "crates/parzi-runtime",
    "crates/parzi-cli",
]
exclude = ["src-tauri"]
resolver = "2"

[workspace.package]
version = "0.1.22"
edition = "2021"
license = "MIT"
repository = "https://github.com/lucas19919/Parzi"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"
pedantic = "warn"

[profile.release]
opt-level = "z"
lto = "thin"
strip = true

