[workspace]
members = [
    "crates/parzi-core",
    "crates/parzi-providers",
    "crates/parzi-runtime",
    "crates/parzi-cli",
]
exclude = ["src-tauri", "setup"]
resolver = "2"

[workspace.package]
version = "1.4.1-dev.21"
edition = "2021"
license = "MIT"
repository = "https://github.com/lucas19919/Parzi"

[workspace.lints.rust]
unsafe_code = "forbid"

# Style hints warn; real mistakes fail `cargo clippy` everywhere, CI included.
[workspace.lints.clippy]
all = { level = "warn", priority = -2 }
pedantic = { level = "warn", priority = -2 }
correctness = { level = "deny", priority = -1 }
suspicious = { level = "deny", priority = -1 }
complexity = { level = "deny", priority = -1 }
perf = { level = "deny", priority = -1 }

[profile.release]
opt-level = "z"
lto = "thin"
strip = true

