[workspace]
members = ["crates/parzi-core", "crates/parzi-providers", "crates/parzi-runtime", "crates/parzi-cli"]
# src-tauri is a detached crate (own lockfile surface); GUI deps never leak into the CLI.
exclude = ["src-tauri"]
resolver = "2"

[workspace.package]
version = "0.1.1"
edition = "2021"
license = "MIT"
repository = "https://github.com/lucas19919/Parzi"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"
pedantic = "warn"

[profile.release]
opt-level = "z"
lto = true
strip = true
codegen-units = 1
